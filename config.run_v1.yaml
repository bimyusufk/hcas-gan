experiment:
  name: HCAS_GAN_Run_v1_Baseline
  seed: 42
hardware:
  device: auto
  num_workers: 8
  multi_gpu: auto
data:
  annotations_dir: ./camo
  annotation_format: labelme_polygon
  image_suffix: .png
  annotation_suffix: .json
  target_label: camou
  ignore_labels:
  - skin
  - weapon
hyperparameters:
  learning_rate_G: 0.0002
  learning_rate_D: 0.0002
  beta1: 0.5
  beta2: 0.999
  batch_size: 16
  epochs: 1000
checkpoint:
  dir: ./checkpoints_runA
  interval: 5
  keep_last_n: 3
  resume_from: null
scheduler:
  enabled: true
  type: cosine
  kwargs:
    eta_min: 0.0
tensorboard:
  enabled: true
  log_dir: ./runs_runA
  run_name: null
  flush_secs: 30
hcas_specific:
  lambda_sal: 15.0
  image_size: 256
  latent_dim: 100
style_prior:
  enabled: false
  dataset_dir: ./camo/style_reference_clean
  lambda_style: 0.0
  max_images: 256
  multiscale:
  - 1.0
  - 0.5
palette:
  enabled: false
  lambda_palette: 0.0
  dataset_dir: ./camo/style_reference_clean
  palette_json_path: ''
frequency:
  enabled: false
  lambda_freq: 0.0
  dataset_dir: ./camo/style_reference_clean
curriculum:
  enabled: false
  schedule_type: linear
  start_epoch: 0
  end_epoch: 1000
  p_small_start: 0.33
  p_small_end: 0.33
  p_large_start: 0.33
  p_large_end: 0.33
sampling:
  mask_area_curriculum:
    enabled: false
    small_threshold: 0.08
    medium_threshold: 0.2
    start_weights:
    - 0.2
    - 0.5
    - 0.3
    end_weights:
    - 0.1
    - 0.3
    - 0.6
    curriculum_epochs: 300
saliency_model:
  backend: auto
  model_name: DeepGazeIII
  pretrained: true
  trust_repo: true
  repo: matthias-k/DeepGaze
  centerbias_mode: zeros
  fixation_history_length: 4
  output_mode: density
  input_range: '0_1'
  allow_fallback: true
  verbose: true
augmentations:
  enabled: true
  random_mask_rotation: true
  max_rotation_deg: 25.0
  mask_scale_range:
  - 0.3
  - 0.8
  max_translate_ratio: 0.08
  hflip_prob: 0.5
  color_jitter: true
  color_jitter_prob: 0.7
  brightness: 0.2
  contrast: 0.2
  saturation: 0.15
  hue: 0.02
  schedule_enabled: true
  schedule_start_factor: 0.35
  schedule_end_factor: 1.0
  schedule_warmup_epochs: 20
